[package]
name = "lockguard"
version = "0.1.4"
edition = "2021"
license = "MIT"
description = "Audit composer.lock for known security vulnerabilities"
readme = "README.md"
repository = "https://github.com/alinaqi2000/lockguard"
homepage = "https://github.com/alinaqi2000/lockguard"
keywords = ["security", "composer", "php", "audit", "vulnerability"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["AGENTS.md", ".env"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "2"
composer-semver = "0.2"

[dev-dependencies]
wiremock = "0.6"
